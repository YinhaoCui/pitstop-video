# Builds the public APK when a version tag (v1.2.3) is pushed and attaches it to a GitHub release.
# Public builds keep the opt-in features off (pitstop.youtubeDownloads, pitstop.driveFullAccess).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PITSTOP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          PITSTOP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PITSTOP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PITSTOP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease

      - name: Name the APK
        run: |
          name="PitstopVideo-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "APK=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
